
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - เปิ้ล</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #ffe4ef, #fbcfe8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px #d9468050;
        }

        .profile-icon {
            width: 130px;
            height: 130px;
            background: #fce7f3;
            border: 5px solid #f9a8d4;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
        }

        h1 {
            color: #be185d;
            margin-bottom: 10px;
        }

        h2 {
            color: #831843;
            font-size: 22px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .skill {
            background: #fce7f3;
            color: #9d174d;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            color: #db2777;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="profile-card">

        <div class="profile-icon">⚽</div>

        <h1>MY PROFILE</h1>

        <h2>นางสาวพรทิพย์ แก้วเกตุ</h2>

        <p><strong>ชื่อเล่น:</strong> เปิ้ล</p>

        <p>
            สวัสดีค่ะ ยินดีต้อนรับเข้าสู่เว็บไซต์
            แนะนำประวัติส่วนตัวของฉัน
        </p>

        <div class="skill">
            ⚽ ความสามารถพิเศษ<br>
            เล่นกีฬาฟุตบอล
        </div>

        <p style="margin-top: 20px;">
            คติประจำใจ:<br>
            "ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น"
        </p>

        <div class="footer">
            Thank you for visiting my profile ♡
        </div>

    </div>
</body>
</html>
